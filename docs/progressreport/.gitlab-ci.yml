stages:
  - build
  - test
  - secret-detection

compile_pdf:
  stage: build
  image: texlive/texlive:latest 
  script:
    - latexmk -pdf -interaction=nonstopmode Progressreport.tex
  artifacts:

    paths:
      - "*.pdf" 
    expire_in: 1 week

sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection